<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Bloco de Citação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <blockquote class="citacao">
            <span class="aspas">“</span>
            <p>
                A tecnologia só tem valor quando é utilizada para
                transformar conhecimento em soluções que melhoram
                a vida das pessoas.
            </p>
            <cite>— Autor desconhecido</cite>
        </blockquote>
    </div>

</body>
</html>
